# Standalone configuration. Copy frontend dist/ contents into the Nginx html/ directory.
# This HTTP configuration is for initial smoke checks. Add domain-specific TLS before public use.
worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ai:10m rate=10r/m;
    limit_req_status 429;
    server {
        listen 80;
        server_name _;
        root html;
        index index.html;
        client_max_body_size 50m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location / {
            try_files $uri $uri/ /index.html;
        }
        location = /api { return 308 /api/; }
        location ~ ^/\. { deny all; }
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            # The trailing slash strips /api/ before forwarding to Spring Boot.
            proxy_pass http://127.0.0.1:7406/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
        location ~ ^/api/aiChat/(chat|chatStream)$ {
            limit_req zone=ai burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:7406;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
