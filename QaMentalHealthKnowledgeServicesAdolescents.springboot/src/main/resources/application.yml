server:
  ip: http://localhost:7406 
  tomcat: #tomact 服务器的配置
    relaxed-query-chars: '|,{,},[,]'  #进行get请求到时候 如何参数包含[,{,},] 认为是正常的
  port: 7406 # 端口
# 数据库凭据从本地 .env.properties 或系统环境变量读取
spring:
  config:
    import: optional:file:../.env.properties,optional:file:.env.properties

  servlet:
    multipart: #文件的上传配置
      max-request-size: 10000MB #请求的最大报文长度不能超过10000MB
      max-file-size: 10024MB #上传的文件最大不能超过10024MB
  datasource: #数据库的配置
    username: ${MYSQL_USERNAME:root} #数据库的账号
    password: ${MYSQL_PASSWORD:} #数据库的密码
    url: jdbc:mysql://localhost:3306/qa_mental_health_knowledge_services_adolescents?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  jackson: # json序列号配置
    date-format: yyyy-MM-dd HH:mm:ss #设置标准的时间格式
    time-zone: Asia/Shanghai #时间对于的时区

mybatis-plus: #操作数据库的ORM框架 mybatis
  mapper-locations: mapper/*.xml #配置对于的mapper文件位置
  global-config: #mybatis的全局配置
    db-config: #数据库的配置
      table-prefix:   #表前面是否加前缀  如果不配置为空 会导致查询的sql表前面带有特定 前缀
      update-strategy: ignored  # 更新时允许设置 null 值      
  configuration:
    #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true         #数据库蛇形命名自动转换为驼峰命名
  type-aliases-package: com.example.web.entity  #实体存储的包位置

# DeepSeek AI配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model-name: deepseek-flash

# Langchain4j AI配置
langchain4j:
  openai:

    # Embedding模型配置 - 使用硅基流动
    # 硅基流动优势: 国内访问快速、中文优化、价格便宜
    # 注册地址: https://cloud.siliconflow.cn/
    embedding-base-url: https://api.siliconflow.cn/v1 #硅基流动API地址
    embedding-model: BAAI/bge-large-zh-v1.5 #中文优化的Embedding模型
    embedding-api-key: ${EMBEDDING_API_KEY:}
    temperature: 0.7 #温度参数,控制生成的随机性
    max-tokens: 4000 #最大token数

  # 向量数据库配置
  vector-store:
    type: pgvector # 向量存储类型: inmemory(内存) 或 pgvector(PostgreSQL)

  # PGVector配置 (当type=pgvector时生效)
  pgvector:
    host: localhost # PostgreSQL主机地址
    port: 5432 # PostgreSQL端口
    database: qa_mental_health_knowledge_services_adolescents # 数据库名
    user: ${PGVECTOR_USER:postgres} # 数据库用户名
    password: ${PGVECTOR_PASSWORD:} # 数据库密码
    table: qa_mental_health_knowledge_services_adolescents # 向量表名
    dimension: 1024 # 向量维度(硅基流动BAAI/bge-large-zh-v1.5是1024维)

security:
  jwt:
    secret: ${JWT_SECRET}
