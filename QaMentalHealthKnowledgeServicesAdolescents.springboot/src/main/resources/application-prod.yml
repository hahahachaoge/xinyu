# Nginx and the JVM run on the same server; only Nginx is publicly exposed.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  ip: ${PUBLIC_API_URL:/api}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
